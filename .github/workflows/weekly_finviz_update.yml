name: Weekly Finviz Data Update

on:
  schedule:
    - cron: '0 1 * * 6'  # 매주 토요일 01:00 UTC = 10:00 KST
  workflow_dispatch:      # 수동 실행 허용

jobs:
  update-finviz-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finviz_main.py
        run: python finviz_main.py

      - name: Commit and push data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/finviz_valuation_data.csv data/finviz_valuation_data.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update finviz valuation data ($(date -u '+%Y-%m-%d'))"
            git push
          fi
